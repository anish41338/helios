[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-serve"
version = "0.1.0"
description = "LLM serving engine: paged attention, continuous batching, deterministic simulation testing"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "safetensors>=0.4",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
helios = "helios.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
# Tests import `helios` from python/ without an install step.
pythonpath = ["python"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
